<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>midnox Sport</title>
<style>
  :root{--bg:#0B0A14;--card:#15142a;--line:#262441;--mut:#9aa0c0;--live:#ef4444;--gold:#FACC15;--acc:#3B5BF0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(1100px 600px at 50% -10%,#1a1640,#0B0A14 60%);color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;padding:3vh 4vw}
  h1{margin:0;font-size:4.2vh}
  h1 b{background:linear-gradient(90deg,#a78bfa,#60a5fa,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--mut);font-size:2vh;margin:.3vh 0 2vh}
  /* Liga-Leiste */
  .tabs{display:flex;gap:1.2vw;overflow-x:auto;scrollbar-width:none;padding-bottom:1.6vh;flex:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:1.1vh 2.4vh;font-size:2.3vh;font-weight:700;white-space:nowrap;color:#cfd3ef}
  .tab.sel{border-color:#a78bfa;background:#241f45;color:#fff;box-shadow:0 0 0 2px rgba(167,139,250,.25)}
  .tab .n{color:var(--live);font-weight:900}
  /* Spiele */
  #list{flex:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:1.4vh;padding:.5vh 0 2vh}
  #list::-webkit-scrollbar{display:none}
  .day{color:var(--mut);font-size:2vh;margin:1.4vh .5vh .2vh;font-weight:700}
  .m{display:flex;align-items:center;gap:2vw;background:var(--card);border:2px solid var(--line);border-radius:2vh;padding:1.8vh 2.2vh}
  .m.sel{border-color:var(--acc);background:#1b1a36;box-shadow:0 1vh 4vh #0006}
  .m.live{border-left:6px solid var(--live)}
  .side{flex:1;display:flex;align-items:center;gap:1.4vw;min-width:0}
  .side.r{flex-direction:row-reverse;text-align:right}
  .logo{width:5.4vh;height:5.4vh;flex:none;object-fit:contain;background:#fff1;border-radius:1vh;padding:.4vh}
  .tn{font-size:2.6vh;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tn .star{color:var(--gold);font-size:2vh}
  .mid{flex:none;min-width:16vw;text-align:center}
  .score{font-size:4.2vh;font-weight:900;line-height:1}
  .score.pending{color:var(--mut);font-size:3vh}
  .state{font-size:1.9vh;color:var(--mut);margin-top:.4vh}
  .state .livedot{color:var(--live);font-weight:900}
  .comp{font-size:1.7vh;color:var(--mut);margin-top:.2vh}
  .empty{color:var(--mut);font-size:2.6vh;text-align:center;margin:auto;padding:6vh}
  .load{color:var(--mut);font-size:2.4vh;text-align:center;margin:auto}
  /* Aktions-Popup */
  #pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,4,12,.72)}
  #pop .box{background:var(--card);border:1px solid var(--line);border-radius:2vh;padding:2vh;min-width:40vw}
  #pop h3{margin:.4vh 1vh 1.6vh;font-size:2.6vh}
  #pop .pb{display:block;width:100%;text-align:left;background:#1b1930;border:2px solid #2a2840;border-radius:1.4vh;color:#fff;font-size:2.6vh;padding:1.6vh 2vh;margin-bottom:1.2vh}
  #pop .pb.sel{background:var(--acc);border-color:transparent}
  .hint{flex:none;color:var(--mut);font-size:1.9vh;text-align:center;padding-top:1vh;border-top:1px solid var(--line)}
  .hint b{color:#fff}
</style></head>
<body>
<div id="app">
  <div><h1><b>midnox</b> Sport</h1><p class="sub">Spielplan &amp; Live-Ergebnisse · Fußball</p></div>
  <div class="tabs" id="tabs"></div>
  <div id="list"><div class="load">Lade…</div></div>
  <div class="hint">◂ ▸ Liga · ▴ ▾ Spiel · <b>OK</b> Aktionen · <b>Zurück</b> schließt</div>
</div>
<div id="pop"><div class="box" id="popbox"></div></div>
<script>
const $=(id)=>document.getElementById(id);
const LEAGUES=[
  {id:'live',name:'Live & Heute',icon:'🔴'},
  {id:'bl1',name:'Bundesliga'},
  {id:'bl2',name:'2. Liga'},
  {id:'bl3',name:'3. Liga'},
  {id:'dfb',name:'DFB-Pokal'},
  {id:'ucl',name:'Champions League'},
  {id:'fav',name:'★ Meine Teams'}
];
const AGG=['bl1','bl2','bl3','dfb','ucl'];   // Quellen für Live/Heute/Favoriten
const API='https://api.openligadb.de/getmatchdata/';
let cache={}, cacheAt={}, leagueIdx=1, matches=[], sel=0, pollTimer=0, curTitle='';
const SEASON_TTL=300000;
let follow=load('favTeams',[]);
function load(k,d){ try{ return JSON.parse(localStorage.getItem(k))||d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function esc(s){ return (s+'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

// --- Daten (volle Saison, damit auch kommende Spiele erscheinen) ---
async function fetchSeason(id){ if(cache[id] && Date.now()-cacheAt[id]<SEASON_TTL) return cache[id];
  try{
    const bare=await (await fetch(API+id)).json();
    const season=(Array.isArray(bare)&&bare[0]&&bare[0].leagueSeason)||new Date().getFullYear();
    let full=await (await fetch(API+id+'/'+season)).json();
    if(!Array.isArray(full)||!full.length) full=Array.isArray(bare)?bare:[];
    full.forEach(m=>m._lg=id);
    cache[id]=full; cacheAt[id]=Date.now(); return full;
  }catch(e){ return cache[id]||[]; } }
function groupId(m){ return (m.group||{}).groupOrderID||0; }
function isToday(m){ const t=new Date(m.matchDateTimeUTC||m.matchDateTime); return t.toDateString()===new Date().toDateString(); }
// Spiele des relevanten Spieltags: der nächste kommende (bzw. live/heute), sonst der letzte
function activeMatches(ms){ if(!ms.length) return [];
  const now=Date.now();
  const liveToday=ms.filter(m=>liveState(m)===1||isToday(m));
  let gid;
  if(liveToday.length) gid=Math.min.apply(null,liveToday.map(groupId));
  else { const up=ms.filter(m=>new Date(m.matchDateTimeUTC||m.matchDateTime).getTime()>now); gid=up.length?Math.min.apply(null,up.map(groupId)):Math.max.apply(null,ms.map(groupId)); }
  return ms.filter(m=>groupId(m)===gid).sort((a,b)=>new Date(a.matchDateTimeUTC||a.matchDateTime)-new Date(b.matchDateTimeUTC||b.matchDateTime));
}
function liveState(m){ // 0=kommend,1=live,2=beendet
  if(m.matchIsFinished) return 2;
  const t=new Date(m.matchDateTimeUTC||m.matchDateTime).getTime();
  const now=Date.now();
  if(now>=t && now < t+150*60000) return 1;
  return now>=t?2:0;
}
function scoreOf(m){ // [a,b] oder null
  if(m.matchResults&&m.matchResults.length){ const fin=m.matchResults.find(r=>/End/i.test(r.resultName))||m.matchResults[m.matchResults.length-1]; if(fin) return [fin.pointsTeam1,fin.pointsTeam2]; }
  if(m.goals&&m.goals.length){ const g=m.goals[m.goals.length-1]; if(g&&g.scoreTeam1!=null) return [g.scoreTeam1,g.scoreTeam2]; }
  return null;
}
function isFav(name){ return follow.indexOf(name)>=0; }
function toggleFav(name){ const i=follow.indexOf(name); if(i>=0) follow.splice(i,1); else follow.push(name); save('favTeams',follow); }

const byDate=(a,b)=> new Date(a.matchDateTimeUTC||a.matchDateTime)-new Date(b.matchDateTimeUTC||b.matchDateTime);
let loadSeq=0;
async function loadView(){
  const myseq=++loadSeq;
  const lg=LEAGUES[leagueIdx]; $('list').innerHTML='<div class="load">Lade…</div>';
  let ms=[], title=''; const now=Date.now();
  if(lg.id==='live'||lg.id==='fav'){
    let all=[]; for(const id of AGG){ all=all.concat(await fetchSeason(id)); }
    if(lg.id==='live'){
      let cur=all.filter(m=>liveState(m)===1||isToday(m));
      if(cur.length){ title='Live & Heute'; }
      else { for(const id of AGG){ activeMatches(all.filter(m=>m._lg===id)).forEach(m=>{ if(new Date(m.matchDateTimeUTC||m.matchDateTime).getTime()>now) cur.push(m); }); } title='Als Nächstes'; }
      ms=cur.sort(byDate).slice(0,30);
    } else {
      const fav=all.filter(m=> isFav((m.team1||{}).teamName)||isFav((m.team2||{}).teamName) ).sort(byDate);
      ms=fav.filter(m=>{ const t=new Date(m.matchDateTimeUTC||m.matchDateTime).getTime(); return liveState(m)===1 || t>now || (now-t)<4*86400000; });
      if(!ms.length) ms=fav.slice(-6);
      title='Meine Teams';
    }
  } else {
    const full=await fetchSeason(lg.id); ms=activeMatches(full);
    title=(ms[0]&&ms[0].group&&ms[0].group.groupName)||'';
  }
  if(myseq!==loadSeq) return;   // eine neuere Ansicht hat bereits übernommen
  matches=ms; curTitle=title; sel=Math.min(sel, Math.max(0,ms.length-1)); render(); schedulePoll();
}
function fmtDay(d){ const days=['So','Mo','Di','Mi','Do','Fr','Sa']; return days[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'; }
function fmtTime(d){ return (''+d.getHours()).padStart(2,'0')+':'+(''+d.getMinutes()).padStart(2,'0'); }
function render(){
  const list=$('list');
  if(!matches.length){ list.innerHTML='<div class="empty">'+(LEAGUES[leagueIdx].id==='fav'?'Noch keine Teams gefolgt.<br>Öffne ein Spiel mit OK und wähle „★ Team folgen".':(LEAGUES[leagueIdx].id==='live'?'Gerade keine Spiele live oder heute.':'Keine Spiele gefunden.'))+'</div>'; return; }
  list.innerHTML=''; let lastDay='';
  if(curTitle){ const h=document.createElement('div'); h.className='day'; h.style.color='#a78bfa'; h.style.fontSize='2.4vh'; h.textContent=curTitle; list.appendChild(h); }
  matches.forEach((m,i)=>{
    const dt=new Date(m.matchDateTimeUTC||m.matchDateTime); const day=fmtDay(dt);
    if(day!==lastDay){ lastDay=day; const h=document.createElement('div'); h.className='day'; h.textContent=day; list.appendChild(h); }
    const s=liveState(m), sc=scoreOf(m);
    const t1=m.team1||{}, t2=m.team2||{};
    const el=document.createElement('div'); el.className='m'+(i===sel?' sel':'')+(s===1?' live':''); el.dataset.i=i;
    const mid = s===1 ? '<div class="score">'+(sc?sc[0]+':'+sc[1]:'0:0')+'</div><div class="state"><span class="livedot">● LIVE</span></div>'
      : s===2 ? '<div class="score">'+(sc?sc[0]+':'+sc[1]:'–')+'</div><div class="state">Beendet</div>'
      : '<div class="score pending">'+fmtTime(dt)+'</div><div class="state">'+fmtDay(dt)+'</div>';
    el.innerHTML=
      '<div class="side"><img class="logo" src="'+(t1.teamIconUrl||'')+'" onerror="this.style.visibility=\'hidden\'"><div class="tn">'+esc(t1.teamName||'?')+(isFav(t1.teamName)?' <span class="star">★</span>':'')+'</div></div>'
      +'<div class="mid">'+mid+'<div class="comp">'+esc(leagueName(m))+'</div></div>'
      +'<div class="side r"><img class="logo" src="'+(t2.teamIconUrl||'')+'" onerror="this.style.visibility=\'hidden\'"><div class="tn">'+esc(t2.teamName||'?')+(isFav(t2.teamName)?' <span class="star">★</span>':'')+'</div></div>';
    list.appendChild(el);
  });
  const selEl=list.querySelector('.m.sel'); if(selEl) selEl.scrollIntoView({block:'nearest'});
}
function leagueName(m){ const map={bl1:'Bundesliga',bl2:'2. Liga',bl3:'3. Liga',dfb:'DFB-Pokal',ucl:'Champions League'}; return map[m._lg]||m.leagueShortcut||m.leagueName||''; }

function renderTabs(){
  const tb=$('tabs'); tb.innerHTML='';
  LEAGUES.forEach((l,i)=>{ const d=document.createElement('div'); d.className='tab'+(i===leagueIdx?' sel':''); d.textContent=l.name; tb.appendChild(d); });
  const s=tb.children[leagueIdx]; if(s) s.scrollIntoView({inline:'center',block:'nearest'});
}

// --- Live-Poll ---
function schedulePoll(){ clearTimeout(pollTimer); const liveLg=[...new Set(matches.filter(m=>liveState(m)===1).map(m=>m._lg||LEAGUES[leagueIdx].id))]; if(liveLg.length){ pollTimer=setTimeout(async()=>{ liveLg.forEach(id=>{ cacheAt[id]=0; }); await loadView(); },40000); } }

// --- Aktions-Popup ---
let popItems=[], popIdx=0, popOpen=false;
function openPop(){ const m=matches[sel]; if(!m)return; popOpen=true; const t1=(m.team1||{}).teamName, t2=(m.team2||{}).teamName;
  popItems=[
    {label:'📺  Auf TV suchen', act:()=>findOnTv(m)},
    {label:(isFav(t1)?'★ ':'☆ ')+'Team folgen: '+t1, act:()=>{ toggleFav(t1); closePop(); render(); }},
    {label:(isFav(t2)?'★ ':'☆ ')+'Team folgen: '+t2, act:()=>{ toggleFav(t2); closePop(); render(); }},
    {label:'↩  Schließen', act:closePop}
  ]; popIdx=0; drawPop(); $('pop').style.display='flex';
}
function drawPop(){ const m=matches[sel]||{}; const box=$('popbox'); box.innerHTML='<h3>'+esc((m.team1||{}).teamName||'')+' – '+esc((m.team2||{}).teamName||'')+'</h3>';
  popItems.forEach((it,i)=>{ const b=document.createElement('div'); b.className='pb'+(i===popIdx?' sel':''); b.textContent=it.label; box.appendChild(b); }); }
function closePop(){ popOpen=false; $('pop').style.display='none'; }
function findOnTv(m){ const q=(m.team1||{}).teamName+' '+(m.team2||{}).teamName; closePop();
  try{ Android.findOnTv((m.team1||{}).teamName||'', (m.team2||{}).teamName||'', leagueName(m)); }catch(e){ /* im Browser-Test kein Android */ } }

// --- Navigation (Fernbedienung) ---
let onTabs=true;
function key(k){
  if(popOpen){ if(k==='up') popIdx=Math.max(0,popIdx-1); else if(k==='down') popIdx=Math.min(popItems.length-1,popIdx+1); else if(k==='ok'){ popItems[popIdx].act(); return; } else if(k==='back'){ closePop(); return; } drawPop(); return; }
  if(onTabs){
    if(k==='left'){ leagueIdx=Math.max(0,leagueIdx-1); renderTabs(); loadView(); }
    else if(k==='right'){ leagueIdx=Math.min(LEAGUES.length-1,leagueIdx+1); renderTabs(); loadView(); }
    else if(k==='down'){ if(matches.length){ onTabs=false; sel=0; render(); } }
    else if(k==='ok'){ loadView(); }
    else if(k==='back'){ try{ Android.exitHub(); }catch(e){} }
  } else {
    if(k==='up'){ if(sel===0){ onTabs=true; render(); } else { sel--; render(); } }
    else if(k==='down'){ sel=Math.min(matches.length-1,sel+1); render(); }
    else if(k==='left'){ leagueIdx=Math.max(0,leagueIdx-1); onTabs=true; renderTabs(); loadView(); }
    else if(k==='right'){ leagueIdx=Math.min(LEAGUES.length-1,leagueIdx+1); onTabs=true; renderTabs(); loadView(); }
    else if(k==='ok'){ openPop(); }
    else if(k==='back'){ onTabs=true; render(); }
  }
}
window.SPORT={ key };   // von Java aufgerufen
// Tastatur zum Testen im Browser
window.addEventListener('keydown',e=>{ const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',Backspace:'back'}; if(map[e.key]){ e.preventDefault(); key(map[e.key]); } });

renderTabs(); loadView();
</script>
</body></html>
