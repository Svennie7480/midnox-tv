<!doctype html><html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>midnox Retro · Gamepad</title>
<style>
  :root{--bg:#0B0A14;--card:#1a1930;--mut:#9aa0c0}
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:sans-serif;overflow:hidden}
  #bar{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:14px;color:var(--mut);flex-wrap:nowrap;overflow-x:auto}
  #bar>*{flex:none}
  #bar b{color:#fff}
  .pbtn{background:var(--card);border:1px solid #2a2840;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px}
  .pbtn.on{background:linear-gradient(90deg,#7C3AED,#3B5BF0);border-color:transparent}
  label.up{margin-left:auto;background:var(--card);border:1px solid #2a2840;border-radius:999px;padding:6px 12px;font-size:13px}
  label.up input{display:none}
  #pad{position:fixed;left:0;right:0;top:46px;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:0 4vw}
  #dpad{position:relative;width:46vw;max-width:360px;height:46vw;max-height:360px;background:var(--card);border-radius:24px;touch-action:none}
  #dpad .k{position:absolute;color:#6b7099;font-size:26px;display:flex;align-items:center;justify-content:center}
  #dpad .ku{top:6%;left:33%;width:34%;height:30%} #dpad .kd{bottom:6%;left:33%;width:34%;height:30%}
  #dpad .kl{left:6%;top:33%;height:34%;width:30%} #dpad .kr{right:6%;top:33%;height:34%;width:30%}
  #dpad .dot{position:absolute;left:50%;top:50%;width:18%;height:18%;transform:translate(-50%,-50%);background:#0d0c18;border-radius:50%}
  #dpad .k.hit{color:#fff}
  .mid{display:flex;flex-direction:column;align-items:center;gap:14px}
  .se{display:flex;gap:16px}
  .se .b{width:64px;height:30px;border-radius:16px}
  .lr{display:flex;gap:30vw;width:100%;justify-content:space-between;position:fixed;top:52px;left:0;padding:0 5vw}
  .lr .b{width:22vw;max-width:150px;height:46px;border-radius:14px}
  #face{position:relative;width:46vw;max-width:360px;height:46vw;max-height:360px}
  .b{background:var(--card);border:1px solid #2a2840;color:#cfd3ef;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
  .b.hit{background:#3B5BF0;color:#fff;border-color:transparent}
  #face .rb{position:absolute;width:30%;height:30%;border-radius:50%;font-size:24px}
  #face .fa{bottom:4%;left:35%;background:#2a1636} #face .fb{right:4%;top:35%;background:#161f2e}
  #face .fy{left:4%;top:35%;background:#13241c} #face .fx{top:4%;left:35%;background:#241a0c}
  #up{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:30px;text-align:center}
</style></head>
<body>
<div id="bar">
  <span>midnox <b>Retro</b></span>
  <button class="pbtn on" id="p1">P1</button>
  <button class="pbtn" id="p2">P2</button>
  <button class="pbtn" id="ff" title="Schnellvorlauf (halten)">⏩</button>
  <button class="pbtn" id="menu" title="Menü am TV">☰</button>
  <button class="pbtn" id="turbo" title="Dauerfeuer A/B">⚡</button>
  <button class="pbtn on" id="vib" title="Vibration">📳</button>
  <label class="up">⬆<input type="file" id="file" accept=".sfc,.smc,.fig,.swc,.gb,.gbc,.gba,.sgb,.zip"></label>
</div>
<div class="lr">
  <div class="b" data-b="1024">L</div>
  <div class="b" data-b="2048">R</div>
</div>
<div id="pad">
  <div id="dpad">
    <div class="k ku">▲</div><div class="k kd">▼</div><div class="k kl">◀</div><div class="k kr">▶</div><div class="dot"></div>
  </div>
  <div class="mid">
    <div class="se">
      <div class="b" data-b="4" style="font-size:12px">SELECT</div>
      <div class="b" data-b="8" style="font-size:12px">START</div>
    </div>
    <div id="face">
      <div class="b rb fx" data-b="512">X</div>
      <div class="b rb fy" data-b="2">Y</div>
      <div class="b rb fa" data-b="1">B</div>
      <div class="b rb fb" data-b="256">A</div>
    </div>
  </div>
</div>
<div id="up"></div>
<script>
var player=0, mask=0, sending=false, dirty=false;
function send(){ if(sending){dirty=true;return;} sending=true; dirty=false;
  fetch('/in?p='+player+'&b='+mask,{cache:'no-store'}).catch(function(){}).finally(function(){ sending=false; if(dirty) send(); });
}
function setBit(b,on){ var m = on ? (mask|b) : (mask & ~b); if(m!==mask){ mask=m; send(); } }

// Vibration + Dauerfeuer
var vibOn=true, turboOn=false, afTimers={};
try{ vibOn=localStorage.getItem('vib')!=='0'; }catch(e){}
function vib(ms){ if(vibOn&&navigator.vibrate){ try{navigator.vibrate(ms);}catch(e){} } }
function startAf(b){ if(afTimers[b])return; var on=true; setBit(b,true); afTimers[b]=setInterval(function(){ on=!on; setBit(b,on); },70); }
function stopAf(b){ if(afTimers[b]){ clearInterval(afTimers[b]); delete afTimers[b]; setBit(b,false); } }

// Face- und Schulter-/Start-Tasten
document.querySelectorAll('.b[data-b]').forEach(function(el){
  var b=parseInt(el.dataset.b);
  el.addEventListener('pointerdown',function(e){ e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('hit'); vib(8); if(turboOn&&(b===1||b===256)) startAf(b); else setBit(b,true); });
  function up(e){ el.classList.remove('hit'); if(afTimers[b]) stopAf(b); else setBit(b,false); }
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('lostpointercapture',up);
});

// Steuerkreuz: Richtung aus der Berührungsposition (Diagonalen möglich)
var dpad=document.getElementById('dpad');
var DIRS={16:dpad.querySelector('.ku'),32:dpad.querySelector('.kd'),64:dpad.querySelector('.kl'),128:dpad.querySelector('.kr')};
function dmove(e){
  e.preventDefault();
  var r=dpad.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-0.5, y=(e.clientY-r.top)/r.height-0.5;
  var dz=0.18, m=mask & ~(16|32|64|128);
  if(y<-dz)m|=16; else if(y>dz)m|=32;
  if(x<-dz)m|=64; else if(x>dz)m|=128;
  for(var k in DIRS) DIRS[k].classList.toggle('hit',(m&k)!==0);
  if(m!==mask){ mask=m; send(); }
}
function dend(e){ var m=mask & ~(16|32|64|128); for(var k in DIRS)DIRS[k].classList.remove('hit'); if(m!==mask){mask=m;send();} }
dpad.addEventListener('pointerdown',function(e){ dpad.setPointerCapture(e.pointerId); dmove(e); });
dpad.addEventListener('pointermove',function(e){ if(e.pressure>0||e.buttons) dmove(e); });
dpad.addEventListener('pointerup',dend); dpad.addEventListener('pointercancel',dend); dpad.addEventListener('lostpointercapture',dend);

// Spielerwahl
document.getElementById('p1').onclick=function(){ player=0; this.classList.add('on'); document.getElementById('p2').classList.remove('on'); };
document.getElementById('p2').onclick=function(){ player=1; this.classList.add('on'); document.getElementById('p1').classList.remove('on'); };
document.getElementById('menu').onclick=function(){ fetch('/cmd?c=menu',{cache:'no-store'}).catch(function(){}); };
// Schnellvorlauf (halten)
var ff=document.getElementById('ff');
ff.addEventListener('pointerdown',function(e){ e.preventDefault(); ff.classList.add('on'); fetch('/cmd?c=ff1',{cache:'no-store'}).catch(function(){}); });
function ffUp(){ ff.classList.remove('on'); fetch('/cmd?c=ff0',{cache:'no-store'}).catch(function(){}); }
ff.addEventListener('pointerup',ffUp); ff.addEventListener('pointercancel',ffUp); ff.addEventListener('lostpointercapture',ffUp);
// Dauerfeuer-Umschalter
document.getElementById('turbo').onclick=function(){ turboOn=!turboOn; this.classList.toggle('on',turboOn); };
// Vibrations-Umschalter
document.getElementById('vib').onclick=function(){ vibOn=!vibOn; this.classList.toggle('on',vibOn); try{localStorage.setItem('vib',vibOn?'1':'0');}catch(e){} if(vibOn) vib(12); };

// ROM-Upload
document.getElementById('file').onchange=function(){
  var f=this.files[0]; if(!f) return;
  var o=document.getElementById('up'); o.style.display='flex'; o.textContent='Lade „'+f.name+'“ hoch …';
  var rd=new FileReader();
  rd.onload=function(){ fetch('/upload?name='+encodeURIComponent(f.name),{method:'POST',body:rd.result})
    .then(function(){ o.textContent='„'+f.name+'“ gestartet – viel Spaß!'; setTimeout(function(){o.style.display='none';},1800); })
    .catch(function(){ o.textContent='Upload fehlgeschlagen.'; setTimeout(function(){o.style.display='none';},2000); }); };
  rd.readAsArrayBuffer(f);
};
window.addEventListener('contextmenu',function(e){e.preventDefault();});
</script>
</body></html>
