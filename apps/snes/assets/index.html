<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>midnox SNES</title>
<style>
  :root{--bg:#0B0A14;--card:#15141F;--line:#262436;--mut:#9aa0c0;--gold:#FACC15;--blue:#3B5BF0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
  #screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000}
  #cv{image-rendering:pixelated;background:#000;height:100vh;width:auto;max-width:100vw}
  #launcher{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:3.5vh 5vw}
  h1{margin:0;font-size:28px}
  h1 b{background:linear-gradient(90deg,#7C3AED,#3B5BF0,#06B6D4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .top{display:flex;align-items:center;gap:16px;margin-bottom:12px}
  .top .sub{color:var(--mut);font-size:14px;margin:2px 0 0}
  .qr{margin-left:auto;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
  .qr svg{width:92px;height:92px;background:#fff;border-radius:6px;display:block}
  .qr .t{font-size:13px;color:var(--mut);max-width:200px}
  .qr .t b{color:var(--gold)}
  .cols{display:flex;gap:16px;min-height:0;flex:1}
  .col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;overflow:auto}
  #leftcol{width:270px;flex:none}
  #rightcol{flex:1}
  .col h2{font-size:12px;letter-spacing:.08em;color:var(--mut);margin:4px 8px 10px}
  #search{width:100%;background:#100f1a;border:1px solid var(--line);border-radius:10px;color:#fff;padding:10px 12px;font-size:15px;margin-bottom:8px}
  button.item{display:block;width:100%;text-align:left;background:transparent;color:#fff;border:0;border-radius:10px;padding:12px 14px;font-size:17px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button.item:focus{outline:none;background:#26243a;box-shadow:inset 0 0 0 2px var(--blue)}
  button.item .s{color:var(--mut);font-size:13px;float:right}
  .dir::before{content:"📁  "} .rom::before{content:"🎮  "} .up::before{content:"⬅  "}
  .recent::before{content:"▶  "} .fav::before{content:"★  "}
  .empty{color:var(--mut);padding:14px}
  #msg{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:var(--gold);font-size:16px;opacity:0;transition:opacity .2s}
  #menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,4,12,.72)}
  #menu .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:320px;max-width:86vw}
  #menu h3{margin:4px 6px 12px;font-size:16px;color:var(--gold)}
  #menu button{display:block;width:100%;text-align:left;background:#1b1930;color:#fff;border:1px solid #2a2840;border-radius:12px;padding:14px 16px;font-size:17px;margin-bottom:8px;cursor:pointer}
  #menu button:focus{outline:none;background:var(--blue);border-color:transparent}
  #menu .row{display:flex;gap:8px}
  #menu .row button{margin-bottom:0}
</style></head>
<body>
  <div id="screen"><canvas id="cv" width="256" height="224"></canvas></div>
  <div id="launcher">
    <div class="top">
      <div><h1><b>midnox</b> SNES</h1><p class="sub">Spiel wählen – oder am Handy öffnen und hochladen.</p></div>
      <div class="qr"><div id="qr"></div><div class="t">📱 Handy-Gamepad:<br>QR scannen oder <b id="padurl">…</b> öffnen</div></div>
    </div>
    <div class="cols">
      <div class="col" id="leftcol"><h2>QUELLEN</h2><div id="sources"></div></div>
      <div class="col" id="rightcol"><input id="search" placeholder="Suchen …"><div id="list"><div class="empty">Links eine Quelle wählen.</div></div></div>
    </div>
  </div>
  <div id="menu"><div class="box" id="menubox"></div></div>
  <div id="msg"></div>
<script src="/lib/qrcode.js"></script>
<script src="/lib/fflate.js"></script>
<script type="module">
import { load } from '/core/snes9x.sdk.js';
const $=(id)=>document.getElementById(id);
let engine=null, pend=[0,0], booting=false, romKey='default', curList=[];
function show(w){ $('screen').style.display=w==='screen'?'flex':'none'; $('launcher').style.display=w==='launcher'?'flex':'none'; }
function msg(t){ const m=$('msg'); m.textContent=t; m.style.opacity=1; clearTimeout(m._t); m._t=setTimeout(()=>m.style.opacity=0,2200); }
function alog(m){ try{Android.log(m);}catch(e){} }

var CODES=[
  {1:'KeyX',2:'KeyZ',4:'ShiftRight',8:'Enter',16:'ArrowUp',32:'ArrowDown',64:'ArrowLeft',128:'ArrowRight',256:'KeyS',512:'KeyA',1024:'KeyQ',2048:'KeyW'},
  {1:'KeyN',2:'KeyB',4:'Digit1',8:'Digit2',16:'KeyI',32:'KeyK',64:'KeyJ',128:'KeyL',256:'KeyH',512:'KeyG',1024:'KeyT',2048:'KeyY'}
];
let lastMask=[0,0];
function key(type,code){ try{ window.dispatchEvent(new KeyboardEvent(type,{code:code,bubbles:true})); }catch(e){} }
window.MX = {
  in(p,m){ pend[p]=m; var cm=CODES[p]; if(!cm) return; var prev=lastMask[p]|0; for(var bit in cm){ var bv=+bit, was=prev&bv, now=m&bv; if(was&&!now) key('keyup',cm[bit]); else if(!was&&now) key('keydown',cm[bit]); } lastMask[p]=m; },
  boot(){ boot(); },
  pause(){ try{ engine&&engine.pause(); }catch(e){} },
  resume(){ try{ if(engine && $('menu').style.display!=='flex') engine.resume(); }catch(e){} },
  menu(){ openMenu(); },
  closeMenu(){ closeMenu(); },
  async saveAuto(){ await saveSlot('auto',true); },
};

function unzipRom(bytes){
  if(bytes[0]===0x50 && bytes[1]===0x4B){ // PK -> ZIP
    try{ const files=window.fflate.unzipSync(bytes); for(const n in files){ const l=n.toLowerCase(); if(l.endsWith('.sfc')||l.endsWith('.smc')||l.endsWith('.fig')||l.endsWith('.swc')) return files[n]; } }catch(e){ alog('unzip fail '+e.message); }
  }
  return bytes;
}
async function boot(){
  if(engine||booting) return; booting=true;
  try{
    try{ romKey=Android.romKey()||'default'; }catch(e){ romKey='default'; }
    const r=await fetch('/rom'); if(!r.ok) throw new Error('kein ROM');
    const rom=unzipRom(new Uint8Array(await r.arrayBuffer()));
    show('screen');
    const base={ canvasEl:$('cv'), assets:{rom}, options:{region:'auto',aspect:'4:3'}, onEvent:(e)=>{} };
    // Erst mit OPFS (für spieleigene Batterie-Speicher); schlägt das im WebView fehl, ohne – Savestates laufen eh über Java.
    try{ engine=await load(Object.assign({persist:'opfs',storageNamespace:romKey}, base)); }
    catch(e){ alog('opfs-fail '+e.message); engine=await load(Object.assign({persist:null}, base)); }
    engine.start();
    if(pend[0]) MX.in(0,pend[0]); if(pend[1]) MX.in(1,pend[1]);
    // Auto-Resume: beim letzten Beenden gesicherten Stand laden
    try{ const a=await fetch('/state?key='+encodeURIComponent(romKey)+'&slot=auto'); if(a.ok){ const d=new Uint8Array(await a.arrayBuffer()); if(d.length>16){ await engine.loadState(d); msg('Spielstand fortgesetzt'); } } }catch(e){}
  }catch(e){ alog('boot-fail '+e.message); msg('Konnte Spiel nicht starten: '+e.message); show('launcher'); engine=null; }
  booting=false;
}

// ---------------- In-Game-Menü ----------------
let menuSel=0;
function menuShown(){ return $('menu').style.display==='flex'; }
function openMenu(){
  if(!engine||menuShown()) return;
  try{ engine.pause(); }catch(e){}
  try{ Android.menuState(true); }catch(e){}
  renderMenu();
  $('menu').style.display='flex';
}
function closeMenu(){
  $('menu').style.display='none';
  try{ Android.menuState(false); }catch(e){}
  try{ engine&&engine.resume(); }catch(e){}
}
function renderMenu(){
  const box=$('menubox');
  box.innerHTML='<h3>⏸ Pause</h3>';
  const add=(label,fn)=>{ const b=document.createElement('button'); b.textContent=label; b.onclick=fn; box.appendChild(b); return b; };
  add('▶  Weiter', closeMenu);
  // Savestate-Slots
  const slotRow=(title,action)=>{
    const t=document.createElement('div'); t.style.cssText='color:#9aa0c0;font-size:13px;margin:6px 6px 4px'; t.textContent=title; box.appendChild(t);
    const row=document.createElement('div'); row.className='row';
    ['1','2','3','4'].forEach(sl=>{ const b=document.createElement('button'); b.textContent=sl; b.style.textAlign='center'; b.onclick=()=>action(sl); row.appendChild(b); });
    box.appendChild(row);
  };
  slotRow('💾  Speichern in Slot', (sl)=>{ saveSlot(sl); msg('In Slot '+sl+' gespeichert'); closeMenu(); });
  slotRow('📂  Laden aus Slot', (sl)=>{ loadSlot(sl); });
  add('↺  Neustart', ()=>{ try{engine.reset();}catch(e){} closeMenu(); });
  add('⏏  Beenden (Stand wird gesichert)', exitGame);
  const first=box.querySelector('button'); if(first) first.focus();
}
async function saveSlot(slot,silent){
  if(!engine) return false;
  try{ const data=await engine.saveState(); await fetch('/state?key='+encodeURIComponent(romKey)+'&slot='+slot,{method:'POST',body:data}); return true; }
  catch(e){ if(!silent) msg('Speichern fehlgeschlagen'); return false; }
}
async function loadSlot(slot){
  try{ const r=await fetch('/state?key='+encodeURIComponent(romKey)+'&slot='+slot); if(!r.ok){ msg('Slot '+slot+' ist leer'); return; } const d=new Uint8Array(await r.arrayBuffer()); await engine.loadState(d); msg('Slot '+slot+' geladen'); closeMenu(); }
  catch(e){ msg('Laden fehlgeschlagen'); }
}
async function exitGame(){ await saveSlot('auto',true); try{ Android.exitGame(); }catch(e){ location.reload(); } }

// ---------------- Bibliothek / Launcher ----------------
function focusFirst(cont){ const b=cont.querySelector('button.item'); if(b) b.focus(); }
function filterList(){ const q=($('search').value||'').toLowerCase(); $('#list'); renderList(curList.filter(x=>!q||x.name.toLowerCase().includes(q))); }
function renderList(items){
  const list=$('list'); list.innerHTML='';
  if(!items.length){ list.innerHTML='<div class="empty">Nichts hier.</div>'; return; }
  items.forEach(x=>{
    const b=document.createElement('button'); b.className='item '+(x.kind||'rom');
    if(x.kind==='dir'){ b.textContent=x.name; b.onclick=()=>openDir(x.path); }
    else if(x.kind==='up'){ b.textContent='Zurück'; b.onclick=()=>openDir(x.path); }
    else { b.innerHTML=(x.size?'<span class="s">'+Math.round(x.size/1024)+' KB</span>':'')+x.name; b.onclick=()=>launch(x.path); }
    list.appendChild(b);
  });
  focusFirst(list);
}
function setList(items){ curList=items; $('search').value=''; renderList(items); }
function openDir(path){
  let d={}; try{ d=JSON.parse(Android.list(path)); }catch(e){ msg('Ordner nicht lesbar'); return; }
  const items=[];
  if(d.parent) items.push({kind:'up',path:d.parent});
  (d.dirs||[]).forEach(f=>items.push({kind:'dir',name:f.name,path:f.path}));
  (d.files||[]).forEach(f=>items.push({kind:'rom',name:f.name,path:f.path,size:f.size}));
  setList(items);
}
function launch(path){ msg('Lade Spiel …'); let ok=false; try{ ok=Android.pick(path); }catch(e){} if(ok) boot(); else msg('Diese Datei ließ sich nicht laden.'); }

function initLauncher(){
  show('launcher');
  let url='—'; try{ url=Android.padUrl(); }catch(e){}
  $('padurl').textContent=url;
  try{ const qr=window.qrcode(0,'M'); qr.addData(url); qr.make(); $('qr').innerHTML=qr.createSvgTag({cellSize:4,margin:1,scalable:true}); }catch(e){ $('qr').textContent=''; }
  // Quellen: Zuletzt gespielt, Favoriten, Speicher
  const sc=$('sources'); sc.innerHTML='';
  const addSrc=(cls,label,fn)=>{ const b=document.createElement('button'); b.className='item '+cls; b.textContent=label; b.onclick=fn; sc.appendChild(b); };
  addSrc('recent','Zuletzt gespielt', showRecent);
  addSrc('fav','Favoriten', showFav);
  let roots=[]; try{ roots=JSON.parse(Android.roots()); }catch(e){}
  roots.forEach(r=>addSrc('dir', r.name, ()=>openDir(r.path)));
  // Startansicht: Zuletzt gespielt, sonst erster Speicher
  let rec=[]; try{ rec=JSON.parse(Android.recent()); }catch(e){}
  if(rec.length) showRecent(); else if(roots.length){ let last=''; try{last=Android.lastDir();}catch(e){} openDir(last||roots[0].path); } else setList([]);
  focusFirst(sc);
}
function showRecent(){ let rec=[]; try{ rec=JSON.parse(Android.recent()); }catch(e){} setList(rec.map(x=>({kind:'rom',name:x.name,path:x.path}))); if(!rec.length) $('list').innerHTML='<div class="empty">Noch nichts gespielt.</div>'; }
function showFav(){ let f=[]; try{ f=JSON.parse(Android.favorites()); }catch(e){} setList(f.map(x=>({kind:'rom',name:x.name,path:x.path}))); if(!f.length) $('list').innerHTML='<div class="empty">Keine Favoriten. Spiel markieren folgt – zunächst über „Zuletzt" und Speicher.</div>'; }

$('search').addEventListener('input',filterList);
// BACK/Menü werden von Java gesteuert (MX.menu/closeMenu). Enter/Pfeile navigieren im Launcher nativ.
try{ if(Android.hasRom()) boot(); else initLauncher(); }catch(e){ initLauncher(); }
</script>
</body></html>
