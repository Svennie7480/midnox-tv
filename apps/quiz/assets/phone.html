<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0B0A14"><title>midnox Quiz</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0B0A14;color:#E6E8F2;font:17px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;padding:18px 16px 22px;max-width:560px;margin:0 auto}
h1{font-size:24px;margin:4px 0 2px}h1 b{background:linear-gradient(90deg,#7C3AED,#3B5BF0,#06B6D4);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#8A8FA8;margin:0 0 18px;font-size:15px}
input{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid #2E2B4A;background:#15141F;color:#fff;outline:none}
input:focus{border-color:#7C3AED}
.btn{display:block;width:100%;margin-top:14px;padding:16px;border:0;border-radius:999px;font:inherit;font-size:19px;font-weight:600;color:#fff;background:linear-gradient(90deg,#7C3AED,#3B5BF0,#06B6D4)}
.m{color:#fca5a5;min-height:22px;margin-top:10px}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.big{font-size:30px;font-weight:700;margin:8px 0}
.hint{color:#8A8FA8}
.me{display:flex;align-items:center;gap:10px;margin-bottom:12px}.dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.me .n{font-weight:600;flex:1}.me .s{color:#9EC5FF;font-weight:600}
.q{font-size:18px;font-weight:600;margin:4px 0 12px}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.a{border:0;border-radius:18px;color:#fff;font:inherit;font-size:17px;font-weight:600;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;transition:transform .08s,opacity .2s}
.a:active{transform:scale(.96)}.a i{font-style:normal;font-size:26px;opacity:.9}
.a.off{opacity:.25}.a.pick{outline:4px solid #fff}
.buzz{flex:1;display:flex;align-items:center;justify-content:center}.buzz button{width:min(78vw,340px);height:min(78vw,340px);border-radius:50%;border:0;font:inherit;font-size:44px;font-weight:800;color:#fff;background:radial-gradient(circle at 35% 30%,#ff6b8a,#E11D48 60%,#9f1239);box-shadow:0 12px 0 #7f1d1d,0 20px 40px rgba(225,29,72,.45);letter-spacing:2px}.buzz button:active{transform:translateY(8px);box-shadow:0 4px 0 #7f1d1d}
.bar{height:8px;border-radius:4px;background:#23212F;overflow:hidden;margin-bottom:12px}.bar div{height:100%;background:linear-gradient(90deg,#7C3AED,#06B6D4);transition:width .3s linear}
.ok{color:#22C55E}.bad{color:#EF4444}
</style></head><body><div class="w" id="app"></div>
<script>
var COLORS=['#7C3AED','#06B6D4','#F59E0B','#EC4899','#22C55E','#3B82F6','#EF4444','#A855F7'];
var AC=['#E11D48','#2563EB','#D97706','#16A34A'],SH=['▲','◆','●','■'];
var id=localStorage.getItem('mq_id')||'',st=null,lastKey='',sent=-1,busy=false;
function $(s){return document.getElementById(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function api(p,b){return fetch('/api/'+p,b?{method:'POST',body:JSON.stringify(b)}:{}).then(function(r){return r.json()})}
var TEAMS=['Team Lila','Team Türkis'],TC=['#7C3AED','#06B6D4'];
function head(){return '<div class="me"><div class="dot" style="background:'+COLORS[st.color||0]+'">'+esc((st.name||'?').charAt(0).toUpperCase())+'</div><div class="n">'+esc(st.name)+(st.team!=null?' <span style="font-size:13px;padding:2px 10px;border-radius:999px;background:'+TC[st.team]+'">'+TEAMS[st.team]+'</span>':'')+'</div><div class="s">'+num(st.score)+' P</div></div>'}
function pct(){return Math.max(0,Math.min(100,st.left/(st.dur||20000)*100))}
var ordSel=[];
function num(v){return (v||0).toLocaleString('de-DE')}
function joinView(msg){
  $('app').innerHTML='<h1><b>midnox</b> Quiz</h1><p class="sub">Mitspielen – gib deinen Namen ein.</p><input id="nm" maxlength="14" placeholder="Dein Name" autocomplete="nickname" value="'+esc(localStorage.getItem('mq_name')||'')+'"><button class="btn" id="go">Los geht’s</button><div class="m" id="msg">'+esc(msg||'')+'</div>';
  $('go').onclick=function(){var n=$('nm').value.trim();if(!n)return;api('join',{name:n}).then(function(r){if(!r.ok){$('msg').textContent=r.msg;return}id=r.id;localStorage.setItem('mq_id',id);localStorage.setItem('mq_name',r.name);lastKey='';poll()}).catch(function(){$('msg').textContent='Keine Verbindung zum Fernseher'})};
  $('nm').onkeydown=function(e){if(e.key==='Enter')$('go').click()};
}
function render(){
  if(!st.joined){if(lastKey!=='join'){lastKey='join';joinView(id?'Das Spiel wurde neu gestartet – bitte nochmal anmelden.':'')}return}
  var key=st.phase+'|'+st.qn+'|'+(st.done?1:0)+'|'+(st.my!=null?st.my:'')+'|'+(st.phase===2?st.correct:'')+'|'+(st.locked?1:0)+'|'+(st.answering?1:0)+'|'+(st.buzzer||'');
  if(st.phase===1){var b=document.querySelector('.bar div');if(b)b.style.width=pct()+'%'}
  if(st.phase===5&&st.answering){var b2=document.querySelector('.bar div');if(b2)b2.style.width=(st.aleft/80)+'%'}
  if(key===lastKey){var s=document.querySelector('.me .s');if(s)s.textContent=num(st.score)+' P';return}
  lastKey=key;var h=head();
  if(st.phase===0){$('app').innerHTML=h+'<div class="mid"><div class="big">Du bist drin! 🎉</div><p class="hint">'+st.players+' Spieler · Gleich geht’s los – schau auf den Fernseher.</p></div>';return}
  if(st.mode===1&&st.phase===1){
    if(st.locked){$('app').innerHTML=h+'<div class="mid"><div style="font-size:60px">🔒</div><div class="big">Gesperrt</div><p class="hint">Du hast bei dieser Frage falsch geantwortet.<br>Warte auf die anderen …</p></div>';return}
    $('app').innerHTML=h+'<div class="bar"><div style="width:'+pct()+'%"></div></div><div class="q">'+(st.qn+1)+'/'+st.total+' · '+esc(st.q)+'</div><div class="buzz"><button id="bz">BUZZ!</button></div><p class="hint" style="text-align:center">Wer zuerst drückt, darf antworten. Falsch kostet 500 Punkte.</p>';
    $('bz').onclick=function(){if(busy)return;busy=true;if(navigator.vibrate)navigator.vibrate(80);api('buzz',{id:id,qn:st.qn}).then(function(){busy=false;lastKey='';poll()}).catch(function(){busy=false})};
    return;
  }
  if(st.phase===5){
    if(!st.answering){$('app').innerHTML=h+'<div class="mid"><div style="font-size:60px">🔔</div><div class="big">'+esc(st.buzzer)+'</div><p class="hint">antwortet gerade …</p></div>';return}
    var g2='';for(var k=0;k<4;k++)g2+='<button class="a" style="background:'+AC[k]+'" data-i="'+k+'"><i>'+SH[k]+'</i>'+esc(st.answers[k])+'</button>';
    $('app').innerHTML=h+'<div class="bar"><div style="width:'+(st.aleft/80)+'%"></div></div><div class="q">Du bist dran! · '+esc(st.q)+'</div><div class="grid">'+g2+'</div>';
    document.querySelectorAll('.a').forEach(function(b){b.onclick=function(){if(busy)return;busy=true;var a=+b.dataset.i;document.querySelectorAll('.a').forEach(function(x){x.classList.add(x===b?'pick':'off')});api('answer',{id:id,qn:st.qn,a:a}).then(function(){busy=false;poll()}).catch(function(){busy=false})}});
    return;
  }
  if(st.phase===1&&st.type==='est'){
    if(st.done){$('app').innerHTML=h+'<div class="mid"><div style="font-size:54px">🔢</div><div class="big">Tipp ist raus</div><p class="hint">Warte auf die anderen …</p></div>';return}
    $('app').innerHTML=h+'<div class="bar"><div style="width:'+pct()+'%"></div></div><div class="q">'+(st.qn+1)+'/'+st.total+' · '+esc(st.q)+'</div><p class="hint">Schätzfrage – wer am nächsten dran ist, gewinnt'+(st.unit?' (Angabe in '+esc(st.unit)+')':'')+'.</p><input id="ev" inputmode="decimal" placeholder="Deine Zahl" style="font-size:30px;text-align:center"><button class="btn" id="es">Tipp abgeben</button><div class="m" id="em"></div>';
    var send=function(){var v=$('ev').value.trim();if(!v)return;if(busy)return;busy=true;api('answer',{id:id,qn:st.qn,v:v}).then(function(r){busy=false;if(!r.ok){$('em').textContent=r.msg||'Bitte eine Zahl';return}lastKey='';poll()}).catch(function(){busy=false})};
    $('es').onclick=send;$('ev').onkeydown=function(e){if(e.key==='Enter')send()};$('ev').focus();
    return;
  }
  if(st.phase===1&&st.type==='ord'){
    if(st.done){$('app').innerHTML=h+'<div class="mid"><div style="font-size:54px">📋</div><div class="big">Reihenfolge ist raus</div><p class="hint">Warte auf die anderen …</p></div>';return}
    if(st.qn!==ordSel.qn){ordSel=[];ordSel.qn=st.qn}
    var rows='';for(var i=0;i<4;i++){var pos=ordSel.indexOf(i);rows+='<button class="a" data-i="'+i+'" style="min-height:64px;flex-direction:row;justify-content:flex-start;gap:12px;background:'+(pos>=0?'#2E2B4A':AC[i])+'"><i style="width:32px">'+(pos>=0?(pos+1)+'.':SH[i])+'</i>'+esc(st.answers[i])+'</button>'}
    $('app').innerHTML=h+'<div class="bar"><div style="width:'+pct()+'%"></div></div><div class="q">'+(st.qn+1)+'/'+st.total+' · '+esc(st.q)+'</div><p class="hint">Tippe die Begriffe nacheinander in der richtigen Reihenfolge an.</p><div style="display:flex;flex-direction:column;gap:10px">'+rows+'</div><div style="display:flex;gap:10px"><button class="btn" id="or" style="background:#23212F">Zurücksetzen</button><button class="btn" id="os"'+(ordSel.length<4?' disabled style="opacity:.4"':'')+'>Senden</button></div>';
    document.querySelectorAll('.a').forEach(function(b){b.onclick=function(){var i=+b.dataset.i;if(ordSel.indexOf(i)<0&&ordSel.length<4){ordSel.push(i);lastKey='';render()}}});
    $('or').onclick=function(){ordSel=[];ordSel.qn=st.qn;lastKey='';render()};
    $('os').onclick=function(){if(ordSel.length<4||busy)return;busy=true;api('answer',{id:id,qn:st.qn,o:ordSel.slice(0,4)}).then(function(){busy=false;lastKey='';poll()}).catch(function(){busy=false})};
    return;
  }
  if(st.phase===1){
    var mine=st.my;
    if(mine>=0){$('app').innerHTML=h+'<div class="mid"><div style="font-size:54px;color:'+AC[mine]+'">'+SH[mine]+'</div><div class="big">Antwort ist raus</div><p class="hint">'+esc(st.answers[mine])+'<br>Warte auf die anderen …</p></div>';return}
    var g='';for(var i=0;i<4;i++)g+='<button class="a" style="background:'+AC[i]+'" data-i="'+i+'"><i>'+SH[i]+'</i>'+esc(st.answers[i])+'</button>';
    $('app').innerHTML=h+'<div class="bar"><div style="width:'+pct()+'%"></div></div><div class="q">'+(st.qn+1)+'/'+st.total+' · '+esc(st.q)+'</div><div class="grid">'+g+'</div>';
    document.querySelectorAll('.a').forEach(function(b){b.onclick=function(){if(busy)return;busy=true;var a=+b.dataset.i;document.querySelectorAll('.a').forEach(function(x){x.classList.add(x===b?'pick':'off')});api('answer',{id:id,qn:st.qn,a:a}).then(function(){busy=false;poll()}).catch(function(){busy=false})}});
    return;
  }
  if(st.phase===2&&st.type==='est'){
    var g=st.gained||0;if(navigator.vibrate)navigator.vibrate(g>=1000?[60]:[30]);
    $('app').innerHTML=h+'<div class="mid"><div style="font-size:60px">'+(st.estrank===1?'🎯':g>0?'👍':'🤷')+'</div><div class="big">Richtig: '+num(st.num)+(st.unit?' '+esc(st.unit):'')+'</div><p class="hint">'+(st.myest!=null?'Dein Tipp: '+num(st.myest)+' · Platz '+st.estrank+' · <b class="ok">+'+num(g)+'</b>':'Kein Tipp abgegeben')+'</p><p class="hint">Platz '+st.rank+' von '+st.players+'</p></div>';
    return;
  }
  if(st.phase===2&&st.type==='ord'){
    var g2=st.gained||0,lst='';for(var k=0;k<4;k++){var ok=st.myord&&st.myord[k]===st.order[k];lst+='<div style="padding:10px 14px;border-radius:12px;background:'+(ok?'#14532d':'#23212F')+';margin:6px 0;text-align:left">'+(k+1)+'. '+esc(st.answers[st.order[k]])+(st.myord?(ok?' ✓':' ✗'):'')+'</div>'}
    $('app').innerHTML=h+'<div class="mid" style="justify-content:flex-start"><div class="big '+(g2>=1250?'ok':'')+'">'+(g2>=1250?'Alles richtig! +1.250':g2>0?'+'+num(g2)+' Punkte':'Leider keine Punkte')+'</div><div style="width:100%">'+lst+'</div><p class="hint">Platz '+st.rank+' von '+st.players+'</p></div>';
    return;
  }
  if(st.phase===2&&st.mode===1){
    var g=st.gained||0;
    if(navigator.vibrate)navigator.vibrate(g>0?[60]:g<0?[120,80,120]:[30]);
    $('app').innerHTML=h+'<div class="mid"><div style="font-size:64px">'+(g>0?'✅':g<0?'❌':'👀')+'</div><div class="big '+(g>0?'ok':g<0?'bad':'')+'">'+(g>0?'Richtig! +'+num(g):g<0?'Falsch! −500':'Diesmal nicht gebuzzert')+'</div><p class="hint">Richtig war: <b style="color:'+AC[st.correct]+'">'+SH[st.correct]+' '+esc(st.answers[st.correct])+'</b></p><p class="hint">Platz '+st.rank+' von '+st.players+'</p></div>';
    return;
  }
  if(st.phase===2){
    var ok=st.my===st.correct;
    if(navigator.vibrate)navigator.vibrate(ok?[60]:[120,80,120]);
    $('app').innerHTML=h+'<div class="mid"><div style="font-size:64px">'+(st.my<0?'⏰':ok?'✅':'❌')+'</div><div class="big '+(ok?'ok':'bad')+'">'+(st.my<0?'Zu langsam':ok?'Richtig! +'+num(st.gained):'Leider falsch')+'</div>'+(ok?'':'<p class="hint">Richtig war: <b style="color:'+AC[st.correct]+'">'+SH[st.correct]+' '+esc(st.answers[st.correct])+'</b></p>')+'<p class="hint">Platz '+st.rank+' von '+st.players+'</p></div>';
    return;
  }
  if(st.phase===3){$('app').innerHTML=h+'<div class="mid"><div class="big">Platz '+st.rank+'</div><p class="hint">'+num(st.score)+' Punkte · nächste Frage kommt gleich</p></div>';return}
  if(st.phase===4){var m=['','🥇','🥈','🥉'][st.rank]||'🎈';var tl='';if(st.teams){var w=st.teams[0]===st.teams[1]?-1:(st.teams[0]>st.teams[1]?0:1);tl='<div class="big" style="color:'+(w<0?'#fff':TC[w])+'">'+(w<0?'Unentschieden!':(w===st.team?'🏆 Dein Team gewinnt!':TEAMS[w]+' gewinnt'))+'</div><p class="hint">Lila '+num(st.teams[0])+' : '+num(st.teams[1])+' Türkis</p>'}
    $('app').innerHTML=h+'<div class="mid">'+tl+'<div style="font-size:70px">'+m+'</div><div class="big">Platz '+st.rank+' von '+st.players+'</div><p class="hint">'+num(st.score)+' Punkte – danke fürs Mitspielen!</p></div>'}
}
function poll(){api('state?id='+encodeURIComponent(id)).then(function(r){st=r;render()}).catch(function(){})}
if(id)poll();else{st={joined:false};render()}
setInterval(poll,500);
</script></body></html>
