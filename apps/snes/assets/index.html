<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>midnox Retro</title>
<style>
  :root{--bg:#0B0A14;--card:#15141F;--line:#262436;--mut:#9aa0c0;--gold:#FACC15;--blue:#3B5BF0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
  #screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000}
  #cv{image-rendering:pixelated;background:#000;height:100vh;width:auto;max-width:100vw}
  #launcher{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);padding:3.5vh 5vw}
  h1{margin:0;font-size:28px}
  h1 b{background:linear-gradient(90deg,#7C3AED,#3B5BF0,#06B6D4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .top{display:flex;align-items:center;gap:16px;margin-bottom:12px}
  .top .sub{color:var(--mut);font-size:14px;margin:2px 0 0}
  .qr{margin-left:auto;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
  .qr svg{width:92px;height:92px;background:#fff;border-radius:6px;display:block}
  .qr .t{font-size:13px;color:var(--mut);max-width:200px}
  .qr .t b{color:var(--gold)}
  .cols{display:flex;gap:16px;min-height:0;flex:1}
  .col{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;overflow:auto}
  #leftcol{width:270px;flex:none}
  #rightcol{flex:1}
  .col h2{font-size:12px;letter-spacing:.08em;color:var(--mut);margin:4px 8px 10px}
  #search{width:100%;background:#100f1a;border:1px solid var(--line);border-radius:10px;color:#fff;padding:10px 12px;font-size:15px;margin-bottom:8px}
  button.item{display:block;width:100%;text-align:left;background:transparent;color:#fff;border:0;border-radius:10px;padding:12px 14px;font-size:17px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button.item:focus{outline:none;background:#26243a;box-shadow:inset 0 0 0 2px var(--blue)}
  button.item .s{color:var(--mut);font-size:13px;float:right}
  button.game{display:flex;align-items:center;gap:12px;padding:8px 12px;white-space:normal}
  button.game .cov{flex:none;width:46px;height:46px;border-radius:8px;background:#0d0c18 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:20px}
  button.game .cov:not(.has)::before{content:"🎮"}
  button.game .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  button.game .nm .s{float:none;margin-left:10px}
  .dir::before{content:"📁  "} .rom::before{content:"🎮  "} .up::before{content:"⬅  "}
  .recent::before{content:"▶  "} .fav::before{content:"★  "}
  .empty{color:var(--mut);padding:14px}
  #msg{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:var(--gold);font-size:16px;opacity:0;transition:opacity .2s}
  #scan{position:absolute;inset:0;display:none;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.28) 3px,rgba(0,0,0,.28) 3px);mix-blend-mode:multiply}
  #menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,4,12,.72)}
  #menu .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:360px;max-width:86vw;max-height:88vh;overflow:auto}
  #menu h3{margin:4px 6px 12px;font-size:16px;color:var(--gold)}
  .mrow{display:block;width:100%;text-align:left;background:#1b1930;color:#fff;border:1px solid #2a2840;border-radius:12px;padding:13px 16px;font-size:17px;margin-bottom:8px}
  .mrow.sel{background:var(--blue);border-color:transparent;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
  .resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(90deg,#7C3AED,#3B5BF0);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-size:18px;cursor:pointer;margin-bottom:12px}
  .resume:focus{outline:none;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
  .resume .rc{flex:none;width:44px;height:44px;border-radius:8px;background:#0d0c18 center/cover no-repeat;display:flex;align-items:center;justify-content:center}
  .resume .rc:not(.has)::before{content:"▶"}
  .resume small{display:block;color:rgba(255,255,255,.75);font-size:13px}
</style></head>
<body>
  <div id="screen"><canvas id="cv" width="256" height="224"></canvas><div id="scan"></div></div>
  <div id="launcher">
    <div class="top">
      <div><h1><b>midnox</b> Retro</h1><p class="sub">NES · SNES · Game Boy / Color / Advance · Spiel wählen oder am Handy hochladen.</p></div>
      <div class="qr"><div id="qr"></div><div class="t">📱 Handy-Gamepad:<br>QR scannen oder <b id="padurl">…</b> öffnen</div></div>
    </div>
    <div id="resumewrap"></div>
    <div class="cols">
      <div class="col" id="leftcol"><h2>QUELLEN</h2><div id="sources"></div></div>
      <div class="col" id="rightcol"><input id="search" placeholder="Suchen …"><div id="list"><div class="empty">Links eine Quelle wählen.</div></div></div>
    </div>
  </div>
  <div id="menu"><div class="box" id="menubox"></div></div>
  <div id="msg"></div>
<script src="/lib/qrcode.js"></script>
<script src="/lib/fflate.js"></script>
<script type="module">
const $=(id)=>document.getElementById(id);
let engine=null, pend=[0,0], booting=false, romKey='default', curList=[], sys='snes';
// Core-Steckbriefe je System: SDK-Modul, load-Optionen, und Tastenbelegung (Bit -> Keycode des Cores)
const SYS={
  snes:{ sdk:'/core/snes9x.sdk.js', opt:{region:'auto',aspect:'4:3'}, codes:[
    {1:'KeyX',2:'KeyZ',4:'ShiftRight',8:'Enter',16:'ArrowUp',32:'ArrowDown',64:'ArrowLeft',128:'ArrowRight',256:'KeyS',512:'KeyA',1024:'KeyQ',2048:'KeyW'},
    {1:'KeyN',2:'KeyB',4:'Digit1',8:'Digit2',16:'KeyI',32:'KeyK',64:'KeyJ',128:'KeyL',256:'KeyH',512:'KeyG',1024:'KeyT',2048:'KeyY'} ]},
  // mGBA: A=KeyX, B=KeyZ, L=KeyA, R=KeyS, Start=Enter, Select=ShiftRight; Y/X gibt es nicht; nur 1 Spieler
  gba:{ sdk:'/core-gba/mgba.sdk.js', opt:{system:'auto',aspect:'native'}, codes:[
    {1:'KeyZ',4:'ShiftRight',8:'Enter',16:'ArrowUp',32:'ArrowDown',64:'ArrowLeft',128:'ArrowRight',256:'KeyX',1024:'KeyA',2048:'KeyS'} ]},
  // NES (jsnes): Eingaben direkt über engine.input(); eigene Belegung nicht nötig. 2 Spieler.
  nes:{ sdk:'/core-nes/nes.sdk.js', opt:{aspect:'4:3'}, codes:[] },
};
function sysFromName(name){ const n=(name||'').toLowerCase();
  if(n.endsWith('.nes')) return 'nes';
  if(n.endsWith('.gb')||n.endsWith('.gbc')||n.endsWith('.gba')||n.endsWith('.sgb')) return 'gba';
  return 'snes';
}
function show(w){ $('screen').style.display=w==='screen'?'flex':'none'; $('launcher').style.display=w==='launcher'?'flex':'none'; }
function msg(t){ const m=$('msg'); m.textContent=t; m.style.opacity=1; clearTimeout(m._t); m._t=setTimeout(()=>m.style.opacity=0,2200); }
function alog(m){ try{Android.log(m);}catch(e){} }

var CODES=[
  {1:'KeyX',2:'KeyZ',4:'ShiftRight',8:'Enter',16:'ArrowUp',32:'ArrowDown',64:'ArrowLeft',128:'ArrowRight',256:'KeyS',512:'KeyA',1024:'KeyQ',2048:'KeyW'},
  {1:'KeyN',2:'KeyB',4:'Digit1',8:'Digit2',16:'KeyI',32:'KeyK',64:'KeyJ',128:'KeyL',256:'KeyH',512:'KeyG',1024:'KeyT',2048:'KeyY'}
];
let lastMask=[0,0];
function key(type,code){ try{ window.dispatchEvent(new KeyboardEvent(type,{code:code,bubbles:true})); }catch(e){} }
window.MX = {
  in(p,m){ pend[p]=m; if(engine && engine.input){ try{ engine.input(p,m); }catch(e){} return; } var cm=(SYS[sys].codes||[])[p]; if(!cm) return; var prev=lastMask[p]|0; for(var bit in cm){ var bv=+bit, was=prev&bv, now=m&bv; if(was&&!now) key('keyup',cm[bit]); else if(!was&&now) key('keydown',cm[bit]); } lastMask[p]=m; },
  boot(){ boot(); },
  pause(){ try{ engine&&engine.pause(); }catch(e){} },
  resume(){ try{ if(engine && !menuShown()) engine.resume(); }catch(e){} },
  menu(){ openMenu(); },
  closeMenu(){ closeMenu(); },
  menuMove(d){ menuMove(d); },
  menuAdjust(d){ menuAdjust(d); },
  menuSelect(){ menuSelect(); },
  turbo(on){ try{ engine&&engine.setTurbo(!!on); }catch(e){} if(engine){ msg(on?'⏩ Schnellvorlauf':''); } },
  rewind(){ rewind(); },
  shot(){ shot(); },
  async saveAuto(){ await saveSlot('auto',true); },
};

const ROM_EXT=['.sfc','.smc','.fig','.swc','.gb','.gbc','.gba','.sgb','.nes'];
function unzipRom(bytes, outerName){
  if(bytes[0]===0x50 && bytes[1]===0x4B){ // PK -> ZIP
    try{ const files=window.fflate.unzipSync(bytes); for(const n in files){ const l=n.toLowerCase(); if(ROM_EXT.some(e=>l.endsWith(e))) return {bytes:files[n], name:n}; } }catch(e){ alog('unzip fail '+e.message); }
  }
  return {bytes, name:outerName};
}
async function boot(){
  if(engine||booting) return; booting=true;
  try{
    try{ romKey=Android.romKey()||'default'; }catch(e){ romKey='default'; }
    let name='game'; try{ name=Android.curName()||'game'; }catch(e){}
    const r=await fetch('/rom'); if(!r.ok) throw new Error('kein ROM');
    const u=unzipRom(new Uint8Array(await r.arrayBuffer()), name);
    const rom=u.bytes; sys=sysFromName(u.name); lastMask=[0,0];
    show('screen');
    const spec=SYS[sys];
    const mod=await import(spec.sdk);   // Core passend zum System laden
    const base={ canvasEl:$('cv'), assets:{rom}, options:spec.opt, onEvent:(e)=>{} };
    // Erst mit OPFS (für spieleigene Batterie-Speicher); schlägt das im WebView fehl, ohne – Savestates laufen eh über Java.
    try{ engine=await mod.load(Object.assign({persist:'opfs',storageNamespace:romKey}, base)); }
    catch(e){ alog('opfs-fail '+e.message); engine=await mod.load(Object.assign({persist:null}, base)); }
    engine.start();
    applyDisplay();   // Scanlines / Glättung aus den Einstellungen
    if(pend[0]) MX.in(0,pend[0]); if(pend[1]) MX.in(1,pend[1]);
    // Auto-Resume: beim letzten Beenden gesicherten Stand laden
    try{ const a=await fetch('/state?key='+encodeURIComponent(romKey)+'&slot=auto'); if(a.ok){ const d=new Uint8Array(await a.arrayBuffer()); if(d.length>16){ await engine.loadState(d); msg('Spielstand fortgesetzt'); } } }catch(e){}
    startRewindCapture();
    autoCover();      // nach ein paar Sekunden ein Vorschaubild sichern (für Spiele ohne Boxart)
  }catch(e){ alog('boot-fail '+e.message); msg('Konnte Spiel nicht starten: '+e.message); show('launcher'); engine=null; }
  booting=false;
}

// ---------------- Schnellvorlauf, Rewind, Screenshot, Anzeige ----------------
let rewBuf=[], rewTimer=0;
function startRewindCapture(){ stopRewindCapture(); rewBuf=[]; rewTimer=setInterval(async()=>{ if(!engine||menuShown())return; try{ const s=await engine.saveState(); rewBuf.push(s); if(rewBuf.length>8) rewBuf.shift(); }catch(e){} }, 4000); }
function stopRewindCapture(){ if(rewTimer) clearInterval(rewTimer); rewTimer=0; rewBuf=[]; }
async function rewind(){ if(!engine) return; if(!rewBuf.length){ msg('Nichts zum Zurückspulen'); return; } const s=rewBuf.pop(); try{ await engine.loadState(s); msg('⏪ Zurückgespult'); if(menuShown()) closeMenu(); }catch(e){ msg('Zurückspulen fehlgeschlagen'); } }
async function shot(auto){ if(!engine) return; try{ const blob=await engine.screenshot(); const buf=new Uint8Array(await blob.arrayBuffer()); let nm='snes'; try{ nm=Android.curName()||'snes'; }catch(e){} await fetch('/shot?name='+encodeURIComponent(nm),{method:'POST',body:buf}); if(!auto){ msg('📸 Screenshot gespeichert'); if(menuShown()) closeMenu(); } }catch(e){ if(!auto) msg('Screenshot fehlgeschlagen'); } }
let autoShotDone=false;
function autoCover(){ autoShotDone=false; setTimeout(()=>{ if(engine && !autoShotDone){ autoShotDone=true; shot(true); } }, 6000); }
// Anzeige-Einstellungen (lokal gespeichert)
function dispGet(k,def){ try{ return localStorage.getItem(k)??def; }catch(e){ return def; } }
function dispSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function applyDisplay(){
  const scan=dispGet('scan','0')==='1', smooth=dispGet('smooth','0')==='1';
  $('scan').style.display=scan?'block':'none';
  try{ engine&&engine.setSmoothing(smooth); }catch(e){}
}

// ---------------- In-Game-Menü (Java-navigiert, zuverlässig per Fernbedienung) ----------------
let menuItems=[], menuIdx=0, muted=false;
function menuShown(){ return $('menu').style.display==='flex'; }
function openMenu(){
  if(!engine||menuShown()) return;
  try{ engine.pause(); }catch(e){}
  try{ Android.menuState(true); }catch(e){}
  buildMenu();
  $('menu').style.display='flex';
}
function closeMenu(){
  $('menu').style.display='none';
  try{ Android.menuState(false); }catch(e){}
  try{ engine&&engine.resume(); }catch(e){}
}
function menuMove(d){ if(!menuShown()) return; menuIdx=Math.max(0,Math.min(menuItems.length-1,menuIdx+d)); drawMenu(); }
function menuAdjust(d){ if(!menuShown()) return; const it=menuItems[menuIdx]; if(it&&it.adjust){ it.adjust(d); drawMenu(); } }
function menuSelect(){ if(!menuShown()) return; const it=menuItems[menuIdx]; if(it&&it.select) it.select(); }
function drawMenu(){
  const box=$('menubox'); box.innerHTML='<h3>⏸ Pause</h3>';
  menuItems.forEach((it,i)=>{ const r=document.createElement('div'); r.className='mrow'+(i===menuIdx?' sel':''); r.textContent=it.label(); box.appendChild(r); });
  const sel=box.querySelector('.sel'); if(sel) sel.scrollIntoView({block:'nearest'});
}
function clampSlot(n){ return Math.max(1,Math.min(4,n)); }
function buildMenu(){
  let sv=1, ld=1; const M=[];
  M.push({label:()=>'▶  Weiter', select:closeMenu});
  M.push({label:()=>'💾  Speichern:  ◂ Slot '+sv+' ▸   (OK sichert)', adjust:d=>{sv=clampSlot(sv+d);}, select:()=>{ saveSlot(''+sv); msg('In Slot '+sv+' gespeichert'); closeMenu(); }});
  M.push({label:()=>'📂  Laden:  ◂ Slot '+ld+' ▸   (OK lädt)', adjust:d=>{ld=clampSlot(ld+d);}, select:()=>{ loadSlot(''+ld); }});
  M.push({label:()=>'⏪  Zurückspulen (ca. '+(rewBuf.length*4)+'s)', select:rewind});
  M.push({label:()=>'📸  Screenshot', select:()=>shot(false)});
  let cp=''; try{ cp=Android.curPath()||''; }catch(e){}
  if(cp){ M.push({label:()=>{ let f=false; try{f=Android.isFav(cp);}catch(e){} return (f?'★':'☆')+'  '+(f?'Favorit entfernen':'Als Favorit merken'); }, select:()=>{ try{ Android.toggleFav(cp,Android.curName()); }catch(e){} drawMenu(); }}); }
  M.push({label:()=>'🖼  Scanlines: '+(dispGet('scan','0')==='1'?'An':'Aus'), select:()=>{ dispSet('scan', dispGet('scan','0')==='1'?'0':'1'); applyDisplay(); drawMenu(); }});
  M.push({label:()=>'✨  Glättung: '+(dispGet('smooth','0')==='1'?'An':'Aus'), select:()=>{ dispSet('smooth', dispGet('smooth','0')==='1'?'0':'1'); applyDisplay(); drawMenu(); }});
  M.push({label:()=>'🔊  Ton: '+(muted?'Aus':'An'), select:()=>{ muted=!muted; try{ engine&&engine.setMute(muted); }catch(e){} drawMenu(); }});
  M.push({label:()=>{ let eff=false; try{eff=Android.swapEffective();}catch(e){} return '🎮  Controller: '+(eff?'Nintendo (A↔B, X↔Y)':'Standard (Xbox)'); }, select:()=>{ let eff=false; try{eff=Android.swapEffective();}catch(e){} try{ Android.setSwap(eff?'off':'on'); }catch(e){} drawMenu(); }});
  M.push({label:()=>'↺  Neustart', select:()=>{ try{engine.reset();}catch(e){} closeMenu(); }});
  M.push({label:()=>'⏏  Beenden (Stand wird gesichert)', select:exitGame});
  menuItems=M; menuIdx=0; drawMenu();
}
async function saveSlot(slot,silent){
  if(!engine) return false;
  try{ const data=await engine.saveState(); await fetch('/state?key='+encodeURIComponent(romKey)+'&slot='+slot,{method:'POST',body:data}); return true; }
  catch(e){ if(!silent) msg('Speichern fehlgeschlagen'); return false; }
}
async function loadSlot(slot){
  try{ const r=await fetch('/state?key='+encodeURIComponent(romKey)+'&slot='+slot); if(!r.ok){ msg('Slot '+slot+' ist leer'); return; } const d=new Uint8Array(await r.arrayBuffer()); await engine.loadState(d); msg('Slot '+slot+' geladen'); closeMenu(); }
  catch(e){ msg('Laden fehlgeschlagen'); }
}
async function exitGame(){ try{ engine&&engine.setTurbo(false); }catch(e){} stopRewindCapture(); await saveSlot('auto',true); try{ Android.exitGame(); }catch(e){ location.reload(); } }

// ---------------- Bibliothek / Launcher ----------------
function focusFirst(cont){ const b=cont.querySelector('button.item'); if(b) b.focus(); }
function filterList(){ const q=($('search').value||'').toLowerCase(); renderList(curList.filter(x=>!q||(x.name||'').toLowerCase().includes(q))); }
// Cover werden erst geladen, wenn die Zeile sichtbar wird (schont GitHub & TV).
const covObs=new IntersectionObserver((ents)=>{ ents.forEach(e=>{ if(!e.isIntersecting) return; const el=e.target; covObs.unobserve(el); const nm=el.dataset.name; const u='/cover?name='+encodeURIComponent(nm); const img=new Image(); img.onload=()=>{ el.style.backgroundImage='url('+u+')'; el.classList.add('has'); }; img.src=u; }); },{root:$('rightcol'),rootMargin:'250px'});
function renderList(items){
  const list=$('list'); list.innerHTML='';
  if(!items.length){ list.innerHTML='<div class="empty">Nichts hier.</div>'; return; }
  items.forEach(x=>{
    const b=document.createElement('button');
    if(x.kind==='dir'){ b.className='item dir'; b.textContent=x.name; b.onclick=()=>openDir(x.path); }
    else if(x.kind==='up'){ b.className='item up'; b.textContent='Zurück'; b.onclick=()=>openDir(x.path); }
    else {
      b.className='item game';
      const cov=document.createElement('span'); cov.className='cov'; cov.dataset.name=x.name;
      const nm=document.createElement('span'); nm.className='nm'; nm.textContent=x.name;
      if(x.size){ const sz=document.createElement('span'); sz.className='s'; sz.textContent=Math.round(x.size/1024)+' KB'; nm.appendChild(sz); }
      b.appendChild(cov); b.appendChild(nm); b.onclick=()=>launch(x.path); covObs.observe(cov);
    }
    list.appendChild(b);
  });
  focusFirst(list);
}
function setList(items){ curList=items; $('search').value=''; renderList(items); }
function openDir(path){
  let d={}; try{ d=JSON.parse(Android.list(path)); }catch(e){ msg('Ordner nicht lesbar'); return; }
  const items=[];
  if(d.parent) items.push({kind:'up',path:d.parent});
  (d.dirs||[]).forEach(f=>items.push({kind:'dir',name:f.name,path:f.path}));
  (d.files||[]).forEach(f=>items.push({kind:'rom',name:f.name,path:f.path,size:f.size}));
  setList(items);
}
function launch(path){ msg('Lade Spiel …'); let ok=false; try{ ok=Android.pick(path); }catch(e){} if(ok) boot(); else msg('Diese Datei ließ sich nicht laden.'); }

function initLauncher(){
  show('launcher');
  let url='—'; try{ url=Android.padUrl(); }catch(e){}
  $('padurl').textContent=url;
  try{ const qr=window.qrcode(0,'M'); qr.addData(url); qr.make(); $('qr').innerHTML=qr.createSvgTag({cellSize:4,margin:1,scalable:true}); }catch(e){ $('qr').textContent=''; }
  // Quellen: Zuletzt gespielt, Favoriten, Speicher
  const sc=$('sources'); sc.innerHTML='';
  const addSrc=(cls,label,fn)=>{ const b=document.createElement('button'); b.className='item '+cls; b.textContent=label; b.onclick=fn; sc.appendChild(b); };
  addSrc('recent','Zuletzt gespielt', showRecent);
  addSrc('fav','Favoriten', showFav);
  let roots=[]; try{ roots=JSON.parse(Android.roots()); }catch(e){}
  roots.forEach(r=>addSrc('dir', r.name, ()=>openDir(r.path)));
  // „Fortsetzen" – direkt ins zuletzt gespielte Spiel
  let rec=[]; try{ rec=JSON.parse(Android.recent()); }catch(e){}
  const rw=$('resumewrap'); rw.innerHTML='';
  if(rec.length && rec[0].path){
    const g=rec[0];
    const b=document.createElement('button'); b.className='resume';
    b.innerHTML='<span class="rc" data-name="'+encodeURIComponent(g.name)+'"></span><span><b>Fortsetzen</b><small>'+g.name.replace(/</g,'&lt;')+'</small></span>';
    b.onclick=()=>launch(g.path);
    rw.appendChild(b);
    const cv=b.querySelector('.rc'); covObs.observe(cv);
    setTimeout(()=>b.focus(),0);
  }
  // Startansicht: Zuletzt gespielt, sonst erster Speicher
  if(rec.length) showRecent(); else if(roots.length){ let last=''; try{last=Android.lastDir();}catch(e){} openDir(last||roots[0].path); } else setList([]);
  if(!rec.length||!rec[0].path) focusFirst(sc);
}
function showRecent(){ let rec=[]; try{ rec=JSON.parse(Android.recent()); }catch(e){} setList(rec.map(x=>({kind:'rom',name:x.name,path:x.path}))); if(!rec.length) $('list').innerHTML='<div class="empty">Noch nichts gespielt.</div>'; }
function showFav(){ let f=[]; try{ f=JSON.parse(Android.favorites()); }catch(e){} setList(f.map(x=>({kind:'rom',name:x.name,path:x.path}))); if(!f.length) $('list').innerHTML='<div class="empty">Keine Favoriten. Spiel markieren folgt – zunächst über „Zuletzt" und Speicher.</div>'; }

$('search').addEventListener('input',filterList);
// BACK/Menü werden von Java gesteuert (MX.menu/closeMenu). Enter/Pfeile navigieren im Launcher nativ.
try{ if(Android.hasRom()) boot(); else initLauncher(); }catch(e){ initLauncher(); }
</script>
</body></html>
